<!-- 驻扎士兵·大壮 — 32px 像素风头像 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges" width="64" height="64">
  <rect width="32" height="32" fill="#0d1b2a"/>
  <!-- 头盔（金属灰 + 蓝纹章） -->
  <rect x="8"  y="3"  width="16" height="2"  fill="#455a64"/>
  <rect x="6"  y="5"  width="20" height="4"  fill="#607d8b"/>
  <rect x="14" y="6"  width="4"  height="2"  fill="#1e88e5"/>
  <!-- 头盔顶饰 -->
  <rect x="14" y="1"  width="4"  height="2"  fill="#1565c0"/>
  <!-- 脸 -->
  <rect x="9"  y="9"  width="14" height="8"  fill="#ffccbc"/>
  <!-- 严肃眼神 -->
  <rect x="12" y="11" width="2"  height="2"  fill="#0d1b2a"/>
  <rect x="18" y="11" width="2"  height="2"  fill="#0d1b2a"/>
  <!-- 鼻 -->
  <rect x="15" y="13" width="2"  height="2"  fill="#ffab91"/>
  <!-- 紧抿的嘴 -->
  <rect x="13" y="15" width="6"  height="1"  fill="#a1300d"/>
  <!-- 铠甲（蓝 + 金属） -->
  <rect x="5"  y="17" width="22" height="15" fill="#1976d2"/>
  <rect x="5"  y="17" width="22" height="2"  fill="#90a4ae"/>
  <!-- 胸甲十字纹章 -->
  <rect x="15" y="20" width="2"  height="6"  fill="#ffeb3b"/>
  <rect x="13" y="22" width="6"  height="2"  fill="#ffeb3b"/>
</svg>
