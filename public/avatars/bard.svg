<!-- 流浪诗人·伊莱 — 32px 像素风头像 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges" width="64" height="64">
  <rect width="32" height="32" fill="#2a0f1d"/>
  <!-- 诗人羽帽 -->
  <rect x="8"  y="2"  width="16" height="2"  fill="#880e4f"/>
  <rect x="6"  y="4"  width="20" height="4"  fill="#c2185b"/>
  <!-- 羽毛 -->
  <rect x="24" y="2"  width="3"  height="2"  fill="#f48fb1"/>
  <rect x="25" y="4"  width="2"  height="2"  fill="#ec407a"/>
  <!-- 头发（金棕） -->
  <rect x="8"  y="8"  width="16" height="2"  fill="#a1887f"/>
  <!-- 脸 -->
  <rect x="9"  y="9"  width="14" height="8"  fill="#fff3e0"/>
  <!-- 眼睛（带光） -->
  <rect x="12" y="12" width="2"  height="2"  fill="#1a0d24"/>
  <rect x="18" y="12" width="2"  height="2"  fill="#1a0d24"/>
  <rect x="13" y="12" width="1"  height="1"  fill="#fff"/>
  <rect x="19" y="12" width="1"  height="1"  fill="#fff"/>
  <!-- 笑容 -->
  <rect x="14" y="15" width="4"  height="1"  fill="#c2185b"/>
  <rect x="13" y="15" width="1"  height="1"  fill="#c2185b"/>
  <rect x="18" y="15" width="1"  height="1"  fill="#c2185b"/>
  <!-- 诗人长袍（粉 + 流苏） -->
  <rect x="6"  y="17" width="20" height="15" fill="#e91e63"/>
  <!-- 琴弦（怀抱的鲁特琴） -->
  <rect x="20" y="20" width="6"  height="4"  fill="#8d6e63"/>
  <rect x="21" y="21" width="1"  height="2"  fill="#fbc02d"/>
  <rect x="23" y="21" width="1"  height="2"  fill="#fbc02d"/>
  <rect x="25" y="21" width="1"  height="2"  fill="#fbc02d"/>
</svg>
