<!-- 旅行商人·阿福 — 32px 像素风头像 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges" width="64" height="64">
  <rect width="32" height="32" fill="#2d1b3d"/>
  <!-- 商人圆帽（紫） -->
  <rect x="9"  y="3"  width="14" height="2"  fill="#6a1b9a"/>
  <rect x="7"  y="5"  width="18" height="3"  fill="#9c27b0"/>
  <rect x="11" y="6"  width="10" height="1"  fill="#fbc02d"/>
  <!-- 脸 -->
  <rect x="9"  y="8"  width="14" height="9"  fill="#ffe0b2"/>
  <!-- 眼睛（精明小眼） -->
  <rect x="12" y="11" width="2"  height="1"  fill="#1a0d24"/>
  <rect x="18" y="11" width="2"  height="1"  fill="#1a0d24"/>
  <!-- 胡子（八字） -->
  <rect x="11" y="14" width="2"  height="1"  fill="#5d3a1f"/>
  <rect x="19" y="14" width="2"  height="1"  fill="#5d3a1f"/>
  <rect x="13" y="15" width="6"  height="1"  fill="#5d3a1f"/>
  <!-- 嘴 -->
  <rect x="14" y="16" width="4"  height="1"  fill="#7d4922"/>
  <!-- 商人长袍（紫 + 金边） -->
  <rect x="6"  y="17" width="20" height="15" fill="#7b1fa2"/>
  <rect x="6"  y="17" width="20" height="1"  fill="#ffc107"/>
  <!-- 金币挂坠 -->
  <rect x="15" y="20" width="2"  height="2"  fill="#ffc107"/>
  <rect x="14" y="21" width="4"  height="1"  fill="#ff8f00"/>
</svg>
