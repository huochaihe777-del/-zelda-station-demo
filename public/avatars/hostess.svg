<!-- 驿站老板娘·惠子 — 32px 像素风头像 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges" width="64" height="64">
  <rect width="32" height="32" fill="#3d2418"/>
  <!-- 头发（红橙） -->
  <rect x="8"  y="4"  width="16" height="4"  fill="#d84315"/>
  <rect x="7"  y="6"  width="2"  height="10" fill="#d84315"/>
  <rect x="23" y="6"  width="2"  height="10" fill="#d84315"/>
  <!-- 脸 -->
  <rect x="9"  y="8"  width="14" height="10" fill="#ffccbc"/>
  <!-- 眼睛 -->
  <rect x="12" y="12" width="2"  height="2"  fill="#3d2418"/>
  <rect x="18" y="12" width="2"  height="2"  fill="#3d2418"/>
  <!-- 腮红 -->
  <rect x="10" y="14" width="2"  height="1"  fill="#ff8a65"/>
  <rect x="20" y="14" width="2"  height="1"  fill="#ff8a65"/>
  <!-- 笑容 -->
  <rect x="14" y="15" width="4"  height="1"  fill="#d84315"/>
  <!-- 围裙领口（橙） -->
  <rect x="8"  y="18" width="16" height="2"  fill="#ff9800"/>
  <rect x="6"  y="20" width="20" height="12" fill="#fb8c00"/>
  <rect x="14" y="20" width="4"  height="2"  fill="#ffe0b2"/>
  <!-- 围裙系带 -->
  <rect x="6"  y="22" width="20" height="1"  fill="#e65100"/>
</svg>
