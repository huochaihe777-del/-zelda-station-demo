[build]
builder = "NIXPACKS"

[deploy]
startCommand = "node server.mjs"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# 提示：Railway dashboard 里需手动操作两件事：
# 1. Settings → Region 选 "Singapore"（亚太节点调方舟/DeepSeek 国内 API 更快）
# 2. Settings → Volumes → Add Volume：Mount Path = /app/data，Size = 1 GB
#    （持久化 SQLite 数据库，避免每次部署重新 embed 499 chunk）
